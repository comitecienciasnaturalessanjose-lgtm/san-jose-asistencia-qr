<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Asistencia QR - San José</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .encabezado {
      background: #0b3d71;
      color: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 20px;
    }

    .encabezado h1 {
      margin: 0;
      font-size: 27px;
    }

    .encabezado p {
      margin: 8px 0 0;
    }

    .tarjeta {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow:
        0 5px 18px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #0b3d71;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 18px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    #estado {
      text-align: center;
      font-weight: bold;
      margin: 15px 0;
    }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 20px;
      text-align: center;
      border-radius: 15px;
      background: #dcfce7;
      border: 2px solid #16a34a;
      color: #14532d;
    }

    .token {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
      word-break: break-all;
    }

  </style>
</head>


<body>

<div class="contenedor">

  <div class="encabezado">

    <h1>ASISTENCIA QR</h1>

    <p>
      Institución Educativa San José
      <br>
      Oporapa - Huila
    </p>

  </div>


  <div class="tarjeta">

    <button
      id="boton"
      onclick="iniciarCamara()"
    >
      📷 INICIAR CÁMARA
    </button>


    <div id="estado">
      Cámara detenida
    </div>


    <div id="reader"></div>


    <div id="resultado">

      <div>
        ✅ CÓDIGO LEÍDO
      </div>

      <div
        id="token"
        class="token">
      </div>

    </div>

  </div>

</div>


<script>

let lector = null;
let iniciado = false;
let ultimoCodigo = "";


async function iniciarCamara() {

  if (iniciado) {
    return;
  }

  const estado =
    document.getElementById("estado");

  const boton =
    document.getElementById("boton");

  estado.innerText =
    "Solicitando permiso para usar la cámara...";

  boton.disabled = true;


  try {

    lector =
      new Html5Qrcode("reader");


    await lector.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      function(codigo) {

        if (codigo === ultimoCodigo) {
          return;
        }

        ultimoCodigo = codigo;

        document
          .getElementById("token")
          .innerText = codigo;

        document
          .getElementById("resultado")
          .style.display = "block";

        estado.innerText =
          "🟢 Cámara activa - QR detectado";

      },

      function(errorLectura) {

        // Los intentos fallidos normales
        // de lectura se ignoran.

      }

    );


    iniciado = true;

    estado.innerText =
      "🟢 CÁMARA ACTIVA";

    boton.style.display =
      "none";


  } catch (error) {

    console.error(error);

    estado.innerHTML =
      "❌ No fue posible abrir la cámara.<br><br>" +
      "Revise los permisos de cámara del navegador.";

    boton.disabled = false;

  }

}

</script>

</body>

</html>
